<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareBeyond Dashboard</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/cbh-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img class="logo" src="assets/cbh-logo-light.svg" alt="CareBeyond Hospital" width="185" height="48">
      <span class="section">Staff dashboard</span>
    </div>
    <div id="who" class="who" hidden>
      <img id="avatar" alt="" width="28" height="28">
      <span id="name"></span>
      <button id="logout" class="ghost">Log out</button>
    </div>
  </header>

  <main>
    <div id="changed" class="notice" role="status" hidden>
      <span>Things have changed.</span>
      <button id="refresh" class="refresh">Refresh</button>
    </div>

    <section id="signed-out" class="card center" hidden>
      <img class="hero-icon" src="assets/cbh-icon.svg" alt="" width="88" height="88">
      <h1>Staff dashboard</h1>
      <p>Log in with the Discord account you use in the CareBeyond - Hospital server.</p>
      <button id="login" class="discord">Log in with Discord</button>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="signed-in" class="card" hidden>
      <h1>Welcome, <span id="welcome-name"></span> <span id="status-badge" class="badge" hidden></span></h1>
      <h2>Your server roles</h2>
      <ul id="roles" class="roles" aria-live="polite"></ul>
      <p id="roles-note" class="muted small"></p>
    </section>

    <p id="loading" class="muted center">Loading…</p>
  </main>

  <footer class="foot">
    CareBeyond Hospital <span aria-hidden="true">·</span>
    <a id="version" href="https://github.com/ldg224/cbh/blob/main/CHANGELOG.md" title="What's changed"></a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
